name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/api/MusicAntiBlur.Api.Tests/MusicAntiBlur.Api.Tests.csproj
      - name: Build
        run: dotnet build src/api/MusicAntiBlur.Api/MusicAntiBlur.Api.csproj --no-restore -c Release
      - name: Test
        run: dotnet test src/api/MusicAntiBlur.Api.Tests/MusicAntiBlur.Api.Tests.csproj --no-restore -c Release

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
