apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: mab-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
